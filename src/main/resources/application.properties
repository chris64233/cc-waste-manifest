spring.application.name=cc-waste-manifest
spring.datasource.url=jdbc:h2:file:./data/cc-waste-manifest
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# 处置方称重与申报总重的默认允许差异比例（5%）
waste-manifest.weight-tolerance-ratio=0.05
